<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 278" font-family="Arial,sans-serif" font-size="18" fill="#233e49">
  <title>Double-diaphragm gripping above the left half of the female tool</title>
  <desc>The two diaphragms grip the blank above the female cavity. All three layers and the mould terminate at the same vertical plane of symmetry. Opposing arrows show external pressure. The interlayer vacuum port and the tool vent are separate.</desc>
  <defs>
    <marker id="load" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto"><path fill="#ac481a" d="m0 0 5 2.5L0 5Z"/></marker>
    <pattern id="section" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e3e9e8"/><path d="m0 8 8-8" stroke="#bcc8c7"/></pattern>
  </defs>
  <text x="22" y="24" fill="#853912">External pressure</text>
  <g fill="none" stroke="#ac481a" stroke-width="2.5" marker-end="url(#load)">
    <path d="M127 45v40"/><path d="M181 45v40"/><path d="M235 45v40"/><path d="M289 45v40"/>
    <path d="M127 157v-40"/><path d="M181 157v-40"/><path d="M235 157v-40"/><path d="M289 157v-40"/>
  </g>
  <!-- All three layers stop at x=312, the same centre plane as the tool. -->
  <g id="stack">
    <path d="M22 93H68Q82 93 96 97H312V105H96Q82 109 68 109H22Z" fill="#daeeed"/>
    <path d="M96 101H312" fill="none" stroke="#263e63" stroke-width="5"/>
    <g fill="none" stroke="#08786f" stroke-width="3.5">
      <path d="M22 93H68Q82 93 96 97H312"/>
      <path d="M22 109H68Q82 109 96 105H312"/>
    </g>
    <path d="M32 87h22v9H32zM32 106h22v9H32z" fill="#596b70"/>
  </g>
  <path d="M48 101H14v34h14" fill="none" stroke="#526970" stroke-width="1.4"/>
  <text x="32" y="141" font-size="17">Interlayer</text><text x="32" y="161" font-size="17">vacuum</text>
  <g id="tool" fill="url(#section)" stroke="#637679" stroke-width="1.5">
    <path d="M22 181H79C126 181 134 211 168 215V243H22Z"/>
    <path d="M177 216C209 220 254 220 312 220V243H177Z"/>
  </g>
  <path d="M172 231v27h-17" fill="none" stroke="#526970" stroke-width="1.4"/>
  <text x="148" y="265" text-anchor="end">Tool vent</text>
  <path id="symmetry-axis" d="M312 34V249" fill="none" stroke="#475762" stroke-width="1.4" stroke-dasharray="10 3 2 3"/>
  <text x="312" y="267" text-anchor="middle">Symmetry axis</text>
  <g font-size="18">
    <path d="M330 86h18" stroke="#08786f" stroke-width="3.5"/><text x="355" y="92">Diaphragms</text>
    <path d="M330 117h18" stroke="#263e63" stroke-width="5"/><text x="355" y="123">Blank</text>
    <rect x="330" y="141" width="18" height="12" fill="url(#section)" stroke="#637679"/><text x="355" y="154">Female tool</text>
  </g>
</svg>
